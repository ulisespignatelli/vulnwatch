name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17,47 * * * *"    # cada 30 min (GitHub puede demorarla unos minutos)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recargar historial completo desde 'backfill_from'"
        type: boolean
        default: false
      backfill_from:
        description: "Fecha de inicio para la recarga (AAAA-MM-DD). Ej: 2020-01-01"
        type: string
        default: ""
      force_deepdive:
        description: "Forzar un deep-dive en Instagram ahora (para probar, ignora el horario)"
        type: boolean
        default: false
      force_linkedin:
        description: "Forzar publicación en LinkedIn ahora (resumen + deep-dive, para probar)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vulnwatch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # si algo falla, GitHub te manda un email automáticamente
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias para la placa de redes
        run: pip install --quiet pillow

      - name: Restaurar datos anteriores (rama 'data')
        run: |
          mkdir -p site/data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C site/data
            echo "Datos restaurados: $(ls site/data/cves | wc -l) meses"
          else
            echo "Primera ejecución: se hará la carga inicial"
          fi

      - name: Descargar vulnerabilidades, KEV, EPSS y noticias
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          BACKFILL_FROM: ${{ inputs.backfill_from || vars.BACKFILL_FROM }}
        run: |
          ARGS="--site-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          python scripts/fetch.py $ARGS

      - name: Generar placa y texto para redes (y publicar en Telegram 1 vez al día)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_HANDLE: ${{ vars.SOCIAL_HANDLE }}
        run: |
          ARGS="--site-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          # publicar en Telegram solo en la hora elegida (UTC). SOCIAL_HOUR por defecto 12 (~09:00 ART).
          HOUR=$(date -u +%H)
          SLOT="${{ vars.SOCIAL_HOUR }}"; SLOT="${SLOT:-12}"
          if [ "$HOUR" = "$SLOT" ]; then ARGS="$ARGS --telegram"; fi
          python scripts/social.py $ARGS || echo "social: omitido"

      - name: Guardar datos en la rama 'data'
        id: savedata
        run: |
          cd site/data
          git init -q -b data
          git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Datos $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf .git

      - name: Publicar en Instagram (1 vez al día)
        if: success()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SOCIAL_HANDLE: ${{ vars.SOCIAL_HANDLE }}
        run: |
          HOUR=$(date -u +%H); SLOT="${{ vars.SOCIAL_HOUR }}"; SLOT="${SLOT:-12}"
          if [ "$HOUR" != "$SLOT" ]; then echo "fuera de la hora de posteo diario"; exit 0; fi
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then echo "Instagram no configurado (opcional)"; exit 0; fi
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.savedata.outputs.sha }}/social/today.jpg"
          python scripts/social.py --instagram --image-url "$URL" || echo "instagram: omitido"
          # Persistir el estado de Instagram (social/posted_ig.json) en la rama 'data',
          # para no repetir la misma tarjeta en la próxima corrida.
          cd site/data
          git init -q -b data
          git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Estado IG $(date -u +%FT%TZ)" || echo "sin cambios"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Deep-dive educativo en Instagram (carrusel, 3 veces al día)
        if: success()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.force_deepdive }}" != "true" ]; then
            HOUR=$(date -u +%H); MIN=$((10#$(date -u +%M)))
            HOURS="${{ vars.DEEPDIVE_HOURS }}"; HOURS="${HOURS:-13,18,23}"   # UTC (≈10, 15, 20 ART)
            case ",$HOURS," in *",$HOUR,"*) : ;; *) echo "fuera de las horas de deep-dive"; exit 0 ;; esac
            # Con el cron de cada 30 min, solo disparamos en la primera corrida de la hora (minuto < 30)
            # para que el deep-dive siga siendo 3 veces al día y no se duplique.
            if [ "$MIN" -ge 30 ]; then echo "segunda corrida de la hora; el deep-dive ya salió"; exit 0; fi
          else
            echo "deep-dive forzado manualmente"
          fi
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then echo "Instagram no configurado (opcional)"; exit 0; fi
          # 1) preparar: elegir la próxima CVE y generar las 4 placas del carrusel
          python scripts/social.py --deepdive --phase prepare || { echo "deep: nada que preparar"; exit 0; }
          [ -f site/data/social/deep_pending.json ] || { echo "deep: sin CVE que califique hoy"; exit 0; }
          # 2) commit a la rama 'data' para tener URLs públicas de las placas
          cd site/data
          git init -q -b data
          git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Deep-dive placas $(date -u +%FT%TZ)" || echo "sin cambios"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          DDSHA=$(git rev-parse HEAD)
          rm -rf .git
          cd ../..
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/$DDSHA/"
          # 3) publicar el carrusel en Instagram
          python scripts/social.py --deepdive --phase publish --base-url "$BASE" || echo "deep: publicación omitida"
          # 4) persistir el estado (social/posted_deepdives.json) para no repetir la misma CVE
          cd site/data
          git init -q -b data
          git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Deep-dive estado $(date -u +%FT%TZ)" || echo "sin cambios"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: LinkedIn — resumen del día (perfil personal, 1 vez al día)
        if: success()
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_REFRESH_TOKEN: ${{ secrets.LI_REFRESH_TOKEN }}
          LI_CLIENT_SECRET: ${{ secrets.LI_CLIENT_SECRET }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          LI_VERSION: ${{ vars.LI_VERSION }}
        run: |
          if [ "${{ inputs.force_linkedin }}" != "true" ]; then
            HOUR=$(date -u +%H); SLOT="${{ vars.SOCIAL_HOUR }}"; SLOT="${SLOT:-12}"
            if [ "$HOUR" != "$SLOT" ]; then echo "fuera de la hora del resumen de LinkedIn"; exit 0; fi
          fi
          if [ -z "$LI_ACCESS_TOKEN" ] || [ -z "$LI_PERSON_URN" ]; then echo "LinkedIn no configurado (opcional)"; exit 0; fi
          python scripts/social.py --linkedin --kind summary || echo "linkedin resumen: omitido"
          cd site/data
          git init -q -b data; git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "LinkedIn estado $(date -u +%FT%TZ)" || echo "sin cambios"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: LinkedIn — deep-dive PDF (perfil personal, 1 vez al día)
        if: success()
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_REFRESH_TOKEN: ${{ secrets.LI_REFRESH_TOKEN }}
          LI_CLIENT_SECRET: ${{ secrets.LI_CLIENT_SECRET }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          LI_VERSION: ${{ vars.LI_VERSION }}
        run: |
          if [ "${{ inputs.force_linkedin }}" != "true" ]; then
            HOUR=$(date -u +%H); MIN=$((10#$(date -u +%M)))
            SLOT="${{ vars.LI_DEEPDIVE_HOUR }}"; SLOT="${SLOT:-18}"   # UTC (≈15 ART)
            if [ "$HOUR" != "$SLOT" ]; then echo "fuera de la hora del deep-dive de LinkedIn"; exit 0; fi
            if [ "$MIN" -ge 30 ]; then echo "segunda corrida de la hora; ya salió"; exit 0; fi
          fi
          if [ -z "$LI_ACCESS_TOKEN" ] || [ -z "$LI_PERSON_URN" ]; then echo "LinkedIn no configurado (opcional)"; exit 0; fi
          python scripts/social.py --linkedin --kind deepdive || echo "linkedin deepdive: omitido"
          cd site/data
          git init -q -b data; git add -A
          git -c user.name="vulnwatch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "LinkedIn deep estado $(date -u +%FT%TZ)" || echo "sin cambios"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Mantener activa la tarea programada
        # GitHub desactiva los cron tras 60 días sin actividad; esto la re-habilita sola.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
